services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: transcrib
      POSTGRES_PASSWORD: transcrib
      POSTGRES_DB: transcrib
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transcrib -d transcrib"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
