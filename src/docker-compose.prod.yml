# Prod stack of transcrib (an isolated compose project on a shared server).
# Deploy: Coolify CD (deploy/coolify-cd.md); IMAGE_TAG is set by the rollout.
# Secrets are in the neighboring .env (chmod 600, outside git). The dev compose (docker-compose.yml) is not touched.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: transcrib
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: transcrib
    volumes:
      - transcrib_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transcrib -d transcrib"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:                       # the log archive is kept by host journald; retention is set on the VPS
      driver: journald
      options:
        tag: "transcrib-{{.Name}}"
    # the port is NOT published outside: app reaches the DB by the name postgres inside the network

  # one-shot: applies goose migrations and exits 0. The same image as app.
  # build is here too (not only in app): the image transcrib:${IMAGE_TAG} is guaranteed
  # to exist by the time migrate starts, without depending on the service build order.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: transcrib:${IMAGE_TAG:?IMAGE_TAG must be set by deploy hook}
    command: ["/goose", "-dir", "/migrations", "postgres", "${DATABASE_URL:?DATABASE_URL must be set in .env}", "up"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: transcrib:${IMAGE_TAG:?IMAGE_TAG must be set by deploy hook}
    env_file: .env
    # RU server: the IPv4 route to the default IP of api.telegram.org (149.154.166.110) is blocked,
    # the host reaches Telegram over IPv6, but Docker containers are IPv4-only -> the bot cannot connect.
    # Pin to a reachable Telegram DC 149.154.167.220 (verified: the Bot API answers).
    extra_hosts:
      - "api.telegram.org:149.154.167.220"
    depends_on:
      migrate:
        condition: service_completed_successfully
    # unless-stopped survives a reboot of the box. On auto-restart the daemon does NOT re-check
    # depends_on (it applies only to compose up), but the schema was already applied by the previous deploy,
    # so app starts correctly without re-running migrate.
    restart: unless-stopped
    logging:                       # the log archive is kept by host journald; Dozzle remains a best-effort live viewer
      driver: journald
      options:
        tag: "transcrib-{{.Name}}"
    # no incoming ports: Telegram long polling (outgoing) + background goroutines

volumes:
  transcrib_pgdata:
