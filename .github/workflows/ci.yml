name: CI

# The dev branch is not listened to here: the same checks run in the checks job of deploy.yml,
# otherwise every push to dev would start two identical runs with two Postgres instances.
#
# Auto triggers were removed on 2026-08-28: GitHub Actions is not used, the checks run
# locally (make ci-check). Restore pull_request and push together with a self-hosted
# runner.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go checks
    # CI_RUNNER switches the job to a self-hosted runner without a commit.
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: transcrib
          POSTGRES_USER: transcrib
          POSTGRES_PASSWORD: transcrib
        # Random host port: on self-hosted two runners would otherwise fight over 5432.
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U transcrib -d transcrib"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --cpus 1
          --memory 512m
    defaults:
      run:
        working-directory: src
    steps:
      # actions/checkout v5.0.0
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      # actions/setup-go v6.0.0
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      # The job context is unavailable in jobs.<id>.env, so the port is resolved here.
      - name: Export DATABASE_URL
        run: echo "DATABASE_URL=postgres://transcrib:transcrib@localhost:${{ job.services.postgres.ports[5432] }}/transcrib?sslmode=disable" >> "$GITHUB_ENV"

      - name: Check
        run: make ci-check
