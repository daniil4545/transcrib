name: CI

# Format, vet, lint, build and the full test suite on PostgreSQL 16. The integration
# tests skip without DATABASE_URL, so the job starts a database and applies the migrations.
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: transcrib
          POSTGRES_USER: transcrib
          POSTGRES_PASSWORD: transcrib
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U transcrib -d transcrib"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      # The job context is unavailable in jobs.<id>.env, so the mapped port is resolved here.
      - name: Export DATABASE_URL
        run: echo "DATABASE_URL=postgres://transcrib:transcrib@localhost:${{ job.services.postgres.ports[5432] }}/transcrib?sslmode=disable" >> "$GITHUB_ENV"

      - name: Format
        run: make fmt-check

      - name: Vet
        run: make vet

      - uses: golangci/golangci-lint-action@0a35821d5c230e903fcfe077583637dea1b27b47 # v9.0.0
        with:
          version: v2.15.0
          working-directory: src

      - name: Build
        run: make build

      - name: Compose check
        run: make deploy-check

      - name: Migrate
        run: make migrate-up

      - name: Test
        run: make test
